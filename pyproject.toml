[project]
name = "nodule"
version = "0.0.1"
description = "Exploring how the processes that form agate interact within a single nodule or seam."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "lbillings-pixel" }]
dependencies = [
    "agatesim",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
gpu = [
    "agatesim[gpu]",
]

[tool.uv.sources]
# agatesim is used as a library, pinned to a commit (ADR 0002).
agatesim = { git = "https://github.com/lbillings-pixel/agatesim", rev = "adfe007ecba88802a48235183c4a9fdfad8d3168" }

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nodule"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "SIM",      # simplify
    "PT",       # pytest style
    "RUF",      # ruff-specific
]
# Mathematical notation in docstrings and comments is intentional.
allowed-confusables = ["−", "–", "ρ", "σ", "θ", "φ", "·", "×", "π", "γ"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
