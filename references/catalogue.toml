notes = """Read in full 2026-10-29 (owner's PDF; DOI and online date 19 Oct 2006 printed on p.53). Companion to proust2007 (2007b). One 30 m Triz-quarry flow: 20 m massive core, 5 m upper and 2 m lower vesicular levels, no columnar jointing; amethyst level ≤ 3 m thick, base at 10 m depth (p.54; 700–1000 cm in Table 4). Geodes have a 'dominant vertical tubular habit with downwards-increasing diameter, with a 0.3 m average height', metre-sized locally (p.54); up to 2.5 m and cone-shaped in the district (p.53). Diameters from photographs of 5 gallery walls (p.55; Fig. 2a about 30 profiles in 4×2 m windows, figure-read; n not stated). Table 3 (p.61): mean equivalent radius 17.68 cm (gallery means 9.30–22.21), max 32.99 cm, mean gap 'with no visible vesiculation' 78.85 cm (60.61–111.88). Table 3 is internally inconsistent: gallery 1's mean volume exceeds its max-radius sphere, and the 'All' row is not a pooled mean. Vesicles (Table 2): mean radius 0.07–0.12 cm, max 0.14–0.40, 1.46e4–1.48e5 per litre, 11–28 % vesicularity, coarsening upward by coalescence; 2D→3D by Cashman & Marsh 1988 (p.58). CSD n = n0 exp(−L/Gt): Gt = 0.029 cm, n0 = 3.57e6 per litre (p.58). Jaeger cooling: x = 4.92√t (top), 2.62√t (base), m and yr; 12 yr total, fronts meet at 18.7 m (pp.56–57); printed coefficients do not reproduce 12 yr (my check gives about 15.8 yr). Bubble-freezing at 1150 °C; modelled max radii are 10× too small; geodes need bubble accumulation (p.60). Water budget: 3.14e5 cm³ from a 39 cm-radius column is enough for about 13 mean geodes (p.63); '83.59 × 10^4 cm³, 7 %' should read 8.359e4 (p.62). Mechanism (hypothesis): magmatic vapour, no external water; cone shape from a Philpotts & Lewis 1987 cooling cap above accumulating bubbles; upward-convex base, intact celadonite rim, no hydraulic fracture; metre geodes by coalescence of tubular cavities (pp.63–64; abstract and conclusion disagree on whether diffusive growth contributes). Opposes Duarte, Hartmann & Vasconcellos 2005 and Hartmann et al. 2015 (ballooning, fractured bases). DOI checked against Crossref 2026-10-30."""

