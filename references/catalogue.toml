notes = """Read the BioOne PDF in full, 2026-10-27. Calcitic fossils in calcite are serially ground at 25.4 µm steps in a steel mount with six 1 mm registration holes and photographed (1524 × 1012 px, two images per layer; 77 µm/px in one sample); 6–7 layers/h, so 2.54 cm ≈ 1000 images ≈ 150 person-hours (pp. 160–161). Global thresholds (Fig. 2E–G: T = 0.25, 0.32, 0.55), closing and a manual "erasing tool" give contours; registration error "about 0.2 mm", "3.3%" of a 0.6 cm specimen (p. 164). Geiger's Nuages Delaunay tetrahedra connect adjacent contours (Fig. 4); accuracy accepted from Geiger (1993) who tested a known geometric object. A parametric model (stem, cup, lip, 6–7 windows, wall thickness T) is fitted "prior to diagenetic effects" (Figs 5–6). Synthetic sections were cut by hand-orienting the model in SceneViewer (clipping planes 0.0001 units apart); the database is "nearly exhaustive" for "obviously distinctive" sections, classed by number of connected components (types 0–7) plus filled Type F (Figs 7–10); no frequencies or statistics. Walls look "thickest in oblique cross-sections that 'graze' the surface" (Fig. 8). Based "on only two tomographic reconstructions"; Type F weighed against alternative readings (diagenetic fattening, separate taxon) by three observations (pp. 170–171). Conclusion: "the vast majority" of outcrop shapes belong to one taxon. MRI tomography gave "discouraging results" (p. 160)."""

