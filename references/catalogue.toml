notes = """Read in full 2026-10-29 (owner's PDF; units checked on page images). Recipe for describing a compact random particle by a spherical-harmonic expansion r(θ,φ) = Σ aₙₘYₙᵐ of its centre-of-mass radius function, from a CT voxel image (pp.1622–1627); 2D Fourier analogue for outlines, coefficients negligible by j = 20, area converged by N ≈ 10 within 0.1% (pp.1623–1624). Requires star-like shapes; overhangs or resolved pores create a false valley detectable as SH-vs-voxel volume mismatch (p.1626). 120×120 = 14 400 (or 240×240) Gaussian-quadrature points (p.1627). Volume, area, mean/Gaussian curvature, inertia from the expansion (pp.1627–1629, App. B); integrated Gaussian curvature k = 1 as quality check (p.1628). Ellipsoid tests: 21:21:105 and 11:11:55 voxels converge by N ≈ 12; 5:5:25 best at N = 12 with volume 5% and area ≈ 8% off, k > 2% off for N ≥ 14; SH follows the digital, not analytical, shape (pp.1629–1631). Voxel-face area overcounts by 1.39–1.42 (prolate), 1.29 (oblate), 1.5 (sphere) (Table 2, p.1631). CT: concrete 75×75 mm prisms, 0.4 mm voxels, 270³ sub-volume, threshold set to known aggregate fraction, erosion/dilation + flood fill to isolate particles (p.1625). Real particles 9175 and 9061 voxels: inertia within ≈1% for N > 12; k needs 240-point quadrature beyond N ≈ 10 (p.1633). Smallest particle ≈ 5–10 voxels per side (250 µm at 50 µm voxels); voxel ≈ sample size / 512–1024 (p.1634). No random generation or overlap test yet (p.1634). For Nodule: a descriptor for nodule envelopes and photo outlines, not a generator. DOI checked against Crossref 2026-10-30."""

