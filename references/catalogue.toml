notes = """Read in full 2026-10-29 (owner's PDF; Eqs, Tables 1–3, Fig. 1 read from page images). Inverts bubble shape and orientation in obsidian for flow type, shear rate and stress; not a synthesis method. Bubble = ellipsoid l ≥ c ≥ b, undeformed radius a, angle θ to flow (Fig. 1, p.113). Ca = aGμs/Γ (Eq. 1, p.112); for vapour bubbles in melts steady shape depends only on Ca if dilute and surfactant-free (p.113). Table 1 (p.114): pure shear D = 2Ca, l/a = 16Ca², θ = 0; simple shear D = Ca, l/a = 3.45Ca^1/2, θ = π/4 − 0.6Ca or tan⁻¹(0.359Ca^−3/4); at Ca = 10 l/b ≈ 36 (simple) vs 6.4×10⁴ (pure) (p.113). Empirical θ(D) and D(Ca) = (0.65 + e^−1.1Ca)tan⁻¹Ca for 0 < D < 1 (Eqs 2–3, p.114). Relaxation time τ = aμs/Γ: 0.1 s for 100 µm bubble in 100 Pa s basalt, 12 days at 10⁹ Pa s (p.114); (l − a)/(lᵢ − a) = e^(−0.67t/τ); orientation and pointed ends survive relaxation (p.114); basalt interiors relax to spheres, stretched bubbles only within mm of pahoehoe surfaces (p.112). Mayor Island: 333 bubbles, elongation grows with size, all parallel (pure shear); cross-section c = 0.0151b² + 1.37b (µm), a = (lbc)^1/3, Ca = 0.0163a (a in µm) (pp.116–117). Table 3 (p.116): log G = −5.2, −2, −6.6/−6.9 s⁻¹ and σ = 4.9, 60, 36/22 kPa for MI, RM, BGM; Γ = 0.3 N/m. One τ of relaxation lowers apparent G, σ by ~14%; interactions at φ = 0.25 overestimate by <10%; wrong flow type at most ×2 (pp.127–128). Single samples, dilute obsidian only (p.129). For Nodule: a physical shape law for host-vesicle envelopes (size-dependent elongation, common orientation), no coalescence or surface detail. DOI checked against Crossref 2026-10-30."""

