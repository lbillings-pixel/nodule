notes = """Analogue, read in full 2026-10-29 (owner's PDF, pypdf; equations and figures checked on rendered pages). Counts every strict local grey maximum and minimum along columns of an X-ray radiograph as laminae, divides by k laminae per varve, and takes the column-to-column variance (Eqs 7–9) as a cumulative error. Resolution rule, asserted without derivation, citation or test: "the smallest lamina thickness should include at least three pixels", so s ≤ (1/3)·t/k; Itrax 60 µm → 180 µm, Avaatech 100 µm → 300 µm thinnest detectable lamina (p. 177). Applied to the average lamina, not the thinnest (Byfjorden 0.75 mm → 0.25 mm pixels, p. 180). Resolution and k are tuned "iteratively … to fit the reference stratigraphic levels with known ages" (p. 177); no ladder of resolutions and no core counted at two resolutions. No uncertain-lamina rule; faint lamination only widens the error (p. 181); thick storm beds count as two years (p. 181). Agreement: Nautajarvi within 2 % of an earlier varve count; Byfjorden storm layers within 1–3 yr; Lake Van ~1000 yr older than Landmann's tephra (varve) ages below 3000 BP, outside its own error bars (p. 181), read by the authors as earlier under-counting. Several internal inconsistencies (Fig. 5 caption swapped; Fig. 4 totals do not match the varve counts)."""

