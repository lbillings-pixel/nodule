notes = """Read in full 2026-10-26 (scanned pages read as images). Model: spherical particles with a concentric spherical core, cut by an IUR plane; profiles are "a mixture of discs and annular rings" (abstract). A ring at offset z has radii (a₀, b₀) = (√(a² − z²), √(b² − z²)) (Eq. 1, p.138). Ring intensity λR = 2λS·μB and disc intensity λD = 2λS(μA − μB) (Eqs. 5, 8, p.138–139), so the fraction of profiles that cut the core is μB/μA. Key invariant: "z² = a² − b² = a₀² − b₀²" (Eq. 11, p.141). The disc profiles obey Wicksell's formula. Inversion (Theorem 3, Eq. 10) exists, but "numerical inversion of integral relationships like these is notoriously unstable" (p.140); "We cannot complete the inversion by obtaining f_S in terms of f_D, since the disc diameters do not contain sufficient information about the shells" (p.140). Analogue for agate: concentric spherical banding is an exact, testable null model for band radii seen in random cuts."""

