notes = """Read in full 2026-10-26 by OCR of the scan the owner supplied (figure data not recoverable; ADR 0072). Two Rio Grande do Sul agates. Electron probe: Al 7–62 ppm (mean ~32) in untwisted bands, 33–210 ppm (mean ~62) in twisted ones; K 40–60 vs 60–80 ppm (pp.1162–63). Ion probe: 'K, Al, Fe, and Na contents oscillate and (mostly) oscillate together'; outward to inward Al decreases slightly and total Fe increases slightly (p.1166); at the drusy quartz Al, K, Na fall below 1 ppm, 'Fe and Ni do not decrease' (p.1167). Fe treated as charge-balancing (Fe²⁺), later substituting (Fe³⁺), not as a growth driver. No banding rate law in this paper (summarises Wang & Merino 1990, 1995). Twist model from Al-dilated fibre peripheries (pp.1158–61), with an unmeasured centre-to-periphery Al difference. Agates 'probably crystallize not from aqueous solutions but from lumps of polymeric silica' (p.1157, speculation); closed system."""

