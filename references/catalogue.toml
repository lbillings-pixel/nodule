notes = """Read in full 2026-10-29 (owner's PDF; equations read from rendered pages; DOI as supplied, not Crossref-checked). 'Sterio' is a pen name (editors' footnote, p.127). Sections sample particles with chance ∝ size; arbitrary particles are sampled uniformly 'only with a three-dimensional probe' (p.127). Disector: two parallel planes h apart plus an unbiased counting frame. Count Q⁻ transects in the frame not hit by the exclusion edges or the look-up plane; N(par) = (ΣQ⁻/ΣP)·(p/(h·a))·V(ref) (Eq. 1, p.129). It requires h < min particle height h_i perpendicular to the planes, and identifiable transects. Unbiased under inhomogeneity (p.129). v̄_N = (ΣP'/ΣQ⁻)(h·a/p') (Eq. 2); s̄_N = (ΣI/ΣQ⁻)(2h·a/l) (Eq. 3); mean height H̄_N = (ΣQ/ΣQ⁻)·h (Eq. 4, p.130). s̄_N and H̄_N need random orientation of particles or disectors; N and v̄_N do not (p.130). Changes in transect topology between the planes correspond one-to-one to signed tangent planes, giving genus/connectivity (p.130). v̄_V = (π/3)·mean(l0³) (Eq. 5) and SD_N(v) = √[v̄_N(v̄_V − v̄_N)] (Eq. 6, p.131). Individual volumes by Cavalieri on an exhaustive stack, v_j = ΣP_j'(h·a/p') (Eq. 7); individual height k_{i,j}·h (Eq. 8, p.132); individual surface not obtainable from sections (p.132). N is unbiased under lost caps if h < min(h_i) − h_c (p.133). Translucent sections of thickness t: h < min(h_i) + t; height estimators gain +t̄ (−h̄_c), and V_V, v̄_N, s̄_N, v_j are biased by t > 0 and h_c > 0 (pp.134–135). Earlier two-plane ideas: Miles 1972, Patterson & Rhines 1979, Exner 1976 (p.135). DOI checked against Crossref 2026-10-30."""

