notes = """Read in full 2026-10-29 (PDF the owner supplied). Stratigraphy of 13 flows (6 Pitanga, 7 Paranapanema) from field sections, 86 scintillometer readings and 56 analyses; NW normal faults drop the sequence more than 200 m westward and postdate the geodes (pp.332, 342–343). Only shape statement: 'prolate geodes have cylindrical shapes up to 5 × 1 m' (p.332; no n or method). Geode flows (Veia Alta, Veia do Meio, Veia Baixa) are type I flows, 20–30 m thick, with a massive core lacking columnar joints (pp.334–336). In the Veia Alta (about 30 m) the geode level is the top 2 m of the 25 m massive core, beneath about 1 m of 'cascalho' (10–30 cm hexagonal blocks, the gallery ceiling) and a 2 m amygdaloidal crust with sandstone injections (p.335). Gilg et al. 2003, as quoted: geode layer 2–4 m at 400–440 m a.s.l. (p.335). Over 60 vol.% alteration to smectite and celadonite (p.336). Ballooning with altered-basalt E = 1–2 GPa versus about 50 GPa unaltered comes from simulations; 'no laboratory experiments' (p.337); hypothesis. DOI checked against Crossref 2026-10-30."""

