notes = """Read in full 2026-10-26 (scanned pages read as images). Membranes modelled as planar sheets with random thickness T, cut by IUR planes; the strip width L in the section satisfies "T = L cos Θ", where Θ is the angle that the normal to the IUR section makes with the sheet surface, with density p(θ) = (4/π)cos²θ on [0, π/2) (Eq. 3, p.86–87). So apparent width ≥ true thickness. Gives F(ℓ) = (4/π)∫₀^ℓ G(t)(t²/ℓ²)(1/√(ℓ² − t²))dt (Eq. 5) and an unbiased, consistent estimator of G(t) as the sample mean of h(ℓ_i/t) (Eq. 1–2, p.85–87). Caveats (p.87–88): the estimate of G "is not restricted to the range [0,1]", "is not monotone increasing", and inherits the "ill-conditioning … in inverse problems involving Abel type integrals, such as … the Wicksell problem"; regularisation advised. Analogue for apparent vs true agate band thickness when the band is locally planar."""

