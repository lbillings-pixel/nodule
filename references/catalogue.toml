notes = """Read in full 2026-10-29 (PDF the owner supplied; glyph-coded text decoded). Qualitative morphodynamic essay; no aspect ratios, sizes with n, or orientation data. Ovoid concretions 'are the rule' (p.44, citing Coleman & Raiswell 1995). Spherical in isotropic sand or fresh mud; 'vertically depressed ellipsoids' once compaction reduces vertical permeability; bread-loaf (flattened lower side) or downward-tapering radish concretions around vertical burrows under steep compaction gradients; lens shapes when growth overlaps compaction, with lamination pinching inside the concretion; slickensided coating if compaction came later (p.44). Posidonia Shale limestone beds are stratiform concretions cemented at different compaction stages (pp.44–45). Chert or cone-in-cone cortex forms once the host is impermeable (p.45). Glomerulus (budded) concretions, epigenetic from meteoric water; the budding test failed for lack of visible lamination (p.45). Marleik 'mummy' pancakes with unexplained top/bottom symmetry (p.46). Pyrite: spherical nucleus in isotropic mud, bedding-parallel discs in stiff mud, growth from inside (pp.50–52); cone-in-cone cones up to 5 cm (p.53). Septaria cracks do not reach the surface, so the early core was not rigid, against Astin 1986 (pp.54, 56); orange-peel radial cracking of a chert ball (p.56). Mechanisms are the author's interpretations, often flagged as provisional. DOI checked against Crossref 2026-10-30."""

