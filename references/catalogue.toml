notes = """Read in full 2026-10-29 (owner's PDF = article-in-press version, pp. 1–19; pages cited are in-press pages). Review of lab CT for ore geology from the UT Austin facility; no costs given. Effective attenuation, photoelectric ∝ Z^4–5 dominant to ≈50–100 keV, Compton ∝ Z to 5–10 MeV (p.3); XCOM curves with quartz lowest, calcite/fluorite just above (Fig. 2, p.4). μ differences down to 0.1% discriminable only over regions spanning many voxels with low noise; CT number of one mineral varies with zoning, alteration, microcrystallinity, microporosity, beam spectrum, object size (p.6). Pixels per side ≈ detector channels (1024/2048); PSF governs true resolution (p.5). Classes: medical 0.5–2 mm (m–dm objects), high-res 100–200 µm (dm–cm), ultra-high < 10 µm (cm–mm) (p.5); 450 kV images silicates up to ≈30–40 cm (p.6); interior zoom ×2–3 cone beam vs ×10–20 near-parallel beam (p.5); near-parallel beam phase contrast highlights borders of equal-attenuation objects (p.2). Artefacts: beam hardening, rings (removal can erase real tangential arcs), starbursts, partial volume (pp.6–7). UTCT: 225 kV microfocal, 5–30 µm spot, mean 50–80 keV, good for similar densities; 450 kV, 0.4/1.0 mm spot; 2048² flat panel, 200 µm pixels; Xradia to 0.2 µm voxels, ~1 µm true resolution, objects to ≈4 cm (pp.7–8). Datasets up to several GB; touching or low-contrast phase separation still operator-driven (pp.8, 18). Au grains measurable to 1/1000 of scan diameter (p.9); Grasberg Au 7–43 µm (p.10). Fluids differ from hosts by orders of magnitude; multiphase fluid inclusions measurable ≥ 0.1 mm³, distribution mapped < 0.0001 mm³ (pp.16–17). No silica-polymorph examples. DOI checked against Crossref 2026-10-30."""

