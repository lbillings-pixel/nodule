notes = """Read the publisher PDF in full, 2026-10-27 (DOI confirmed on Crossref 2026-10-26). Local thickness τ(p) is "the diameter of the largest sphere which contains the point and which is completely inside the structure" (§2.1, Eq. 1); plates, cylinders and balls of size d return d. Mean is volume-weighted (Eq. 2); distribution and moments (SD, skewness) from Eqs 4–5. Applied to background it gives separations (§2.1). Biases (§2.3): rough surfaces and noise cause "undesirable underestimation" (corrected mean above T_min, Eq. 6, T_min > one voxel, §2.4); cut edges lower τ, remedied by shrinking the ROI by T_max (Fig. 4). Implementation: Euclidean distance map plus "distance ridge" of non-redundant spheres (§2.4, Eqs 7–11); "stochastic error corresponding to the dimension of one voxel". The paper applies the definition only in 3D; the 2D circle-fitting analogue (Garrahan et al. 1987) yields "local apparent widths" that need stereological correction (§1). Demonstrated on two trabecular-bone µCT biopsies (14 µm voxels, 286³): mean 0.20 ± 0.11 mm and 0.11 ± 0.03 mm (§3, Figs 6–8); no phantom or ground-truth test. "Our method requires true 3-D images"; proposes calibrating 2D stereology on a 3D subset (§4). Basis of BoneJ/ImageJ local thickness."""

