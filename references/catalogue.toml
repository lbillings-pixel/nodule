notes = """Analogue, read in full 2026-10-29 (owner's PDF, pypdf; pp. 3, 8, 11, 12 viewed rendered for Table 1, Fig. 5, the error formulas and Table 3). Origin of the GICC05 uncertain-layer convention: 'From the start it was agreed between the investigators that the uncertain marks should be regarded and counted as "half years"' (¶17, p. 5); 'regarded as 0.5 ± 0.5 year', MCE = sum, 'assuming that the counting errors are correlated' (¶40, p. 11), 'highly conservative' (p. 12); alternatives 9 yr (uncorrelated) and 72 yr (by period) computed and set aside. No 25–75 % probability band here (that wording is andersen2006's). Uncertain marks by criteria: weak or mistimed seasonal indicators; evidence in some series only (type I); shoulders/double peaks possibly two unresolved layers (type II, ~3/4 of YD uncertain marks); data gaps; counter disagreement. Effective resolution = 'the shortest wavelength that can be identified from the data' (Table 1, p. 3; ¶9), 3–25× the sampling step, GRIP values 'from inspection of the data'. YD mean layer < 2× shortest resolvable cycle, so thin layers 'may ... vanish' (¶22); lost layers upper limit 'a few tens of years', ~1 %, not in the MCE (¶38). Finer VS data hold sub-annual peaks and are smoothed (σ = 4 mm, ¶6); [Ca2+] fewer peaks than [NH4+] partly from lower resolution, all NH4+ peaks +7 % (¶17). No resolution ladder. Counters: 3 independent + arbitrator; totals within 1.5 % but ~200 positional differences in 2.4 kyr (¶18); NGRIP up to 5 % (YD) and 10 % (OD) (¶19); two-group bias ≤ 1 % (¶40). Reinterpretation moved counts +1.5 %/+6.6 %, 4–5× the uncertain marks (¶39); rule bias excluded from all errors (abstract, ¶48)."""

