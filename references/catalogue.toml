notes = """Read in full 2026-10-29 (owner's scanned PDF; OCR text plus rendered pages for all equations and tables; DOI from the file name, not Crossref-checked). Sheet between locally planar, parallel faces; target S_V(τ), face area per volume by thickness τ (p.718). The probe must be IUR unless face orientation is isotropic (p.718). Apparent thickness r = distance from the reference trace to the opposite trace, weighted by trace length (B_A, p.719). Plane: f(θ | hit) = (4/π)sin²θ, r = τ/sinθ (p.720). Abel inversions for t = τ^n (Eqs. 3–4). E(τ^k) = (√π/2)Γ((4−k)/2)/Γ((3−k)/2)·E(r^k), k < 3: E(τ) = (π/4)E(r), E(τ²) = ½E(r²), E(1/τ) = (3π/8)E(1/r), E(1/τ²) = (4/3)E(1/r²) (Eq. 5, p.720), identical to Jensen et al. 1979. Line: f(θ | hit) = 2 sinθ cosθ, l = τ/cosθ, E(τ^k) = (1 − k/2)E(l^k), k < 2, so E(τ²) is not estimable from lines (Eq. 14, p.723); S_V(t) = (n+2)N_L + n t dN_L/dt (Eq. 13, p.722). Discrete unfolding with mid-point class values and F(x) = ½(x − sin x cos x) (Eqs. 6–9, 15–17). Inverse matrices for n = −1/2 (Table 1 plane: upper-triangular, diagonal 4/π to 2.346; Table 2 line: alternating entries up to |14.45|). Exponential classes (factor 15^0.1 = 1.31) give Toeplitz q-coefficients (Tables 3–4, Eqs. 10, 18). Gundersen et al. 1978's class conventions shift the unfolded histogram (p.724). Variance not predictable without sheet size and shape (pp.721, 724). Noise-free synthetic test, S_V = 4000, τ^{−1/2} ~ truncated N(0.50, 0.12): mean(1/τ) true 0.2644, plane-unfolded 0.2574, line-unfolded 0.2595, direct 0.2653/0.2656 (Table 5, p.726); for τ itself, mean true 4.5905, unfolded 4.6337/4.5664 (Table 6, p.728). Needs smooth, low-curvature faces and IUR probes; prefers negative powers (1/τ) because r and l are unbounded (p.729). No curvature or section-thickness correction (see jensen1979). DOI checked against Crossref 2026-10-30."""

