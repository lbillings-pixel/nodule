notes = """Broad framework for geological pattern formation; §5.1.1 reviews agate (read 2026-10-15). Micro-banding of defect-rich chalcedony and macrocrystalline quartz at ~100 µm, with oscillatory zonation of defects at 0.5–5 µm; the change of refractive index along these bands gives iris colours; iris spacing ~2 µm (Fig. 35, after jones1952); 'Zones with iris banding exist in nearly every agate, although they are often concealed by pigmentation.' Growth starts as spherulites at the wall, then common banding equidistant to the walls. Against Liesegang models: no sharp corners, ring defects, Jabłczyński spacing law not seen in agate, gel shrinkage problem. Against external-rhythm models: nearby agates have uncorrelated band sequences. Wang–Merino model: Al3+ accumulating at the front accelerates quartz crystallisation, alternating chalcedony and quartz bands. §4.1.5 (read in M8): Liesegang band positions follow a geometric series x_n ≈ x0 (1 + p)^n; pre-nucleation (Ostwald–Prager supersaturation feedback) and post-nucleation (ripening) models; both may occur in nature. §4.1.6: oscillatory zoning has extrinsic or intrinsic (growth-dynamics) causes; intrinsic examples are growth-rate–partition-coefficient feedback (Mn in calcite) and alternation of end-members of different solubility."""

# --- Banding mechanisms ------------------------------------------------------

[[references]]
id = "wang1990"
kind = "article"
authors = ["Wang, Y.", "Merino, E."]
year = 1990
title = "Self-organizational origin of agates: banding, fiber twisting, composition, and dynamic crystallization model"
venue = "Geochimica et Cosmochimica Acta 54, 1627–1638"
doi = "10.1016/0016-7037(90)90396-3"
access = "closed"
licence = "publisher copyright; cite only"
checked = "full-text"
topics = ["banding", "self-organization", "reaction-diffusion", "fiber-twisting"]
notes = """Read in full 2026-10-26 (PDF the owner supplied; ADR 0072). Rio Grande do Sul agates, optical microscopy and CL. Observed: broad layers of fine twisted fibres alternate with thin ribbons (tens of µm) of coarser untwisted fibres, both length-fast (p.1628); layers thicken inward from sub-mm to mm; brown belts are 'accumulations of micropores or fluid inclusions' beside the ribbons; bands become visible by 'the aggregate optical contrast' between coarse untwisted and fine twisted fibres (p.1628). Al not measured: the electron probe was at detection limits, and ribbons are only 'tentatively' Al-poor from their blue CL (p.1630). Model ('speculative', p.1631): 1D closed-system mass balance, growth G = α·u·(1+βv)^n with u silica and v Al at the front; limit cycle for 5<μ<20, 60<β<120, 1.7<n<2.5, 0.005<λ<0.015 (p.1634): steep but not a saturating switch. Needs initial silica ≳1 g SiO2/cm³, so a gel, not a solution (pp.1634–35). Al³⁺, Mg²⁺, Fe³⁺, Zn²⁺ cited as experimental catalysts of silica crystallisation (p.1630); only Al modelled. Inclusions trapped at the growth-rate maximum (p.1635). Twist from Al substitution (Eqn 17, p.1636), disputed by heaney1993."""

[[references]]
id = "wang1995"
kind = "article"
authors = ["Wang, Y.", "Merino, E."]
year = 1995
title = "Origin of fibrosity and banding in agates from flood basalts"
venue = "American Journal of Science 295(1), 49–77"
doi = "10.2475/ajs.295.1.49"
access = "closed"
licence = "publisher copyright; cite only"
checked = "full-text"
topics = ["banding", "self-organization", "fibers", "morphological-instability"]
notes = """Read in full 2026-10-26 by OCR of the scan the owner supplied (equations partly reconstructed; ADR 0072). Corrects the 1990 model (p.52). Polymeric silica and a 'catalyst' diffuse through a boundary zone of imposed thickness L to the front; catalyst arrives attached to silica and is left behind (eq 4). Growth G = α′[1 + β′1 c_c + β′2 c_c²](c_s − c_e*), 'a truncated Taylor's expansion of a monotonic increasing function' (p.57), not a saturating switch; the mechanism of rate increase is unknown (p.52). The banding model actually solved is a two-point lumped ODE pair, 'formally identical' to the authors' calcite zoning model (pp.59–60). Sustained limit cycles need θ = D_s/D_c below about 0.2 (values used 0.05–0.06): 'the initial medium should be dense and polymerized' (pp.60–61). With D ~10⁻⁷ cm²/s and L = 0.1 cm, about 30 h and about 0.1 mm per band (p.61). The outer boundary is held at fixed concentrations, so the oscillation never ends in the model. Fibres from a morphological instability of the front, width 2πL/m_p ≈ 5 µm, varying about 4× along the cycle, finer and twisted at high catalyst (pp.64–71). Catalyst identity not given; experimental hints cited for Na, K, Mg, Al, Fe³⁺, Mn²⁺ and others (p.54, fn 2)."""

