notes = """Analogue (whole tree cross-sections), read 2026-10-26 from arXiv v2 HTML. Pipeline: background removal, resize to 1500x1500, Canny-Devernay sub-pixel edges; keep edge points whose gradient is within 30 deg of the pith-to-point ray (drops radial cracks); sample 360 rays into nodes and chains; merge chains longest-first with radial tolerance, similar radial distribution and no intervening chain, over nine relaxing iterations; close a gap only if the chains cover more than 180 deg. Assumptions (§3): "The rings are roughly concentric, even if their shape is irregular", rings do not intersect, "Each ray crosses a curve only once"; pith location required. Metric (§6.2): ground-truth influence areas, a match needs 60% of nodes inside, P/R/F plus radial RMSE. UruDendro F 0.89-0.91, Kennel F 0.97; about 17 s per image. F falls with pith error; knots and fungus give false rings; "rings can disappear without forming a closed curve" and stay open (not counted)."""

