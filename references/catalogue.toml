notes = """Read in full 2026-10-29 (owner's PDF). The original Yeong–Torquato method: on a periodic pixel lattice started as a random checkerboard at the reference volume fraction, swap two pixels of different phase (preserving φ) and accept by Metropolis to minimise E = Σ[f_s(r) − f_0(r)]² (Eq. 1), or a weighted sum over phases and several n-point functions with weights α that may change by stage (Eq. 3) (p.496). T₀ set for 50% initial acceptance; stop at E < tolerance or ~20 000 consecutive rejections; no cooling rate given (p.496). Uses isotropic S2(r) and lineal-path L(r), sampled exhaustively along rows and columns only, assuming isotropy (p.497–498); digitised S2 slope at 0 is −s/(2D) vs −s/4 for a 3D continuum (Eqs 7–8, p.497); incremental updates along lines through swapped pixels (p.497–498). Tests: 1D 1000-px and 2D 400×400 media; periodic rods reconstructed perfectly (p.499); for hard rods, hard disks (φ=0.2, d=17 px) and overlapping disks (d=31, φ=0.5) S2-only reconstructions match S2 yet give wrong structures (wrong rod lengths; overlapping-disk result percolates), L does better and S2+L best (p.499–502); orthogonal-only sampling makes square particles (p.501); unrealisable targets give the nearest feasible structure (p.500–501, 504); Fontainebleau 2D slice 280×280 at 7.5 µm, hybrid resembles the original but voids are more rounded (p.505). No CPU times or iteration counts reported. Assumes statistically homogeneous, isotropic media; not applicable as published to concentrically banded agate. DOI checked against Crossref 2026-10-30."""

