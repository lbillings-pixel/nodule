notes = """Read in full 2026-10-29 (owner's scanned PDF; equations and the sideways p.95 tables read from rendered pages; DOI confirmed on Crossref 2026-10-26). r and x are diameters. Spheres with uniform density of centres and size distribution (p.86). Bodies cut per unit section area = N·r·F(r)dr, total N·r0; size-weighted f(r) = rF(r)/r0 (Eqs. 2–3, p.87). Kernel: x² = r² − 4y², φ(x) = (x/r0)∫_x^R F(r)dr/√(r²−x²) (Eq. 5, p.87). Solved via Abel/von Zeipel: F(r) = (2r·r0/π)∫₀^{√(R²−r²)} P(√(l²+r²))dl, P(x) = −(1/x)d(φ/x)/dx (Eqs. 8–9, p.88), applied to a hand-smoothed histogram (p.88). N = V/v0 or n = N·r0·Y (p.89). Moments: N₃' = (3/2)N₁'v₂' (area fraction = volume fraction); general Eq. 11 and p.91; mean true diameter = (π/2) × harmonic mean of apparent diameters (p.90). Rayleigh F(r) = (r/σ²)e^{−r²/2σ²} is invariant under sectioning, r0 = σ√(π/2); Rayleigh mixtures are not (pp.91–92). The kernel written with f(r) also holds for randomly oriented ellipsoids of any shape if 'diameter' is the geometric mean of the section's largest and smallest diameters (A_y = A0(1 − y²/h²), p.92); the paper gives no population (F) link for ellipsoids. Globular-cluster analogue (p.93). Discrete unfolding in 1 mm classes: f_i = Σ P_{i+j}a_ij, a_ij = √((i+j)² − (i−½)²) − √((i+j)² − (i+½)²), with a_ij = combined thickness of the centre layers giving apparent diameter i ± ½ (Eq. 16, p.94); inverse matrix Eq. 18 (p.95). Tests: Rayleigh σ = 5 recovered well, r0 6.22 vs 6.26; 6 classes too few for high accuracy (r0 1.52 vs 1.57); a mixture is inexact in clustered classes (pp.96–98); Hellman's 1092 spleen profiles: a truncated small class gave a negative P₂ and the smallest classes were extrapolated by hand, r0 = 5.82 (p.99). The paper does not itself use the term ill-conditioning (that framing is from [@cruzorive2017]). DOI checked against Crossref 2026-10-30."""
