checked = "sections"
sections_read = ["introduction", "proposed mechanisms", "implications", "start of evidence"]
topics = ["agate", "banding", "fibres", "morphological-instability", "surface-tension", "catalysis"]
notes = "Two-page conference abstract, read from the scanned page images (regularised H1, ADR 0028). Their model (Wang and Merino) couples diffusion, growth rate, silica and 'catalyst' concentrations, and the curvature and surface energy of the growth front. Catalyst segregated ahead of the front speeds growth and so its own accumulation, making silica and trace-element concentrations at the front oscillate. At the same time the front is morphologically unstable (citing Sekerka 1973): bumps grow into fingers, which become the fibres. A linear analysis gives a dispersion relation in which high growth-rate constant and catalysis favour fibrosity and surface tension and solubility impede it, with a preferred fibre thickness of a few micrometres. Oscillatory banding needs very low silica diffusivity. No equations or parameter values in the abstract."

