notes = "Read in full (M8). Zoning profiles of hydrothermal garnet and vesuvianite and magmatic plagioclase analysed by the width method w(l) ~ l^H and power spectra: self-affine over up to two decades, Hurst exponents mostly 0.25–0.45 (anti-persistent), no distinct periodic components, and no chaos found (Grassberger–Procaccia, nonlinear forecasting). A periodic pattern instead gives w(l) slope ~1 below the period and ~0 above it. Profiles are records in depth, distorted from time by a varying growth rate. Simulations: Brownian noise imposed at the edge of a diffusion layer is smoothed only below a correlation length xi, which is below 0.1 µm for open hydrothermal systems, so profiles record external fluctuations nearly unfiltered; a concentration-dependent growth rate does not change the statistics; multi-valued (nonideal) responses can transform the noise. They attribute anti-persistence to anti-persistent forcing, and expect closed systems like agate to be internally driven. Large jumps record events such as veins opening."

