notes = """Read in full 2026-10-29 (owner's PDF; equations read from rendered pages, since the text layer was garbled; DOI as supplied, not Crossref-checked). Orthogonal intercept L0 = T/sinΘ, measured on IUR planes perpendicular to a boundary trace (Eq. 2, p.21). The pdf of Θ for sectioned surface elements is r(θ) = (4/π)sin²θ (Eq. 1, p.20), which assumes T independent of Θ. F(l0) = ∫[1 − H(τ/l0)]g(τ)dτ, H(u) = (2/π)[arcsin u − u√(1−u²)] (Eqs. 3–4, p.21). Moments: E(L0^m) = (2/π)B((3−m)/2, ½)E(T^m), infinite for m ≥ 3; E(L0) = (4/π)E(T), E(1/L0) = (8/3π)E(1/T), E(L0²) = 2E(T²), E(L0⁻²) = (3/4)E(T⁻²) (Eqs. 8–11, p.22). For constant T, 94% of L0 lie in [T, 2T] (Fig. 2, p.22). Unbiased: (π/4)·mean L0 and ½·mean L estimate E(T); (3π/8)·mean(1/L0) and (3/2)·mean(1/L) estimate E(1/T) (p.25). CV relations (Eqs. 13–14, p.25): orthogonal intercepts are 1.08–3.05× more efficient than IUR intercepts for E(1/T); Var(L) = ∞. Curvature (concentric spheres, c = ±T/r): L0' = (T/c){sinΘ − [(1−c)² − cos²Θ]^½} (Eq. 12, p.23); positive curvature overestimates and lacks intercepts for Θ < arccos(1−c), negative curvature underestimates. Section thickness s: L0' = (T/sinΘ)(1 ± (s/T)cosΘ) for maximal/minimal projection; s/T is decisive (p.23). Too-curved traces give 'islands' and 'waves' with no intercept; take the minimal perpendicular (Fig. 4, p.24). Abel inversion (Eq. 15, p.25) is numerically troublesome (p.26); grouped Saltykov-type unfolding (Eqs. 16–17, p.26) shows negative correlation between adjacent classes (p.30); a generalised-gamma ML fit (Eqs. 18–21) did better on 1081 intercepts vs 449 direct thicknesses, (α,β,δ) = (5.65, 0.968, 1.35) (Table 1, p.30). Validity rests on isotropy of surface orientation relative to the plane, 'a problem of sampling, not of measuring' (pp.32–33). DOI checked against Crossref 2026-10-30."""

