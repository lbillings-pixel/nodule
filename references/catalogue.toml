checked = "sections"
sections_read = ["Abstract", "Crofton formulae", "The Cavalieri principle", "Probe and object interaction: dimensional considerations", "Sampling in a continuous domain (end)", "Model based stereology", "Global stereology: the general design", "Particle number", "Connectivity", "Planar area and volume", "Surface area and length under isotropy", "Particle size", "Membrane thickness", "Anisotropy (part)", "Second order stereology", "Error variance prediction under systematic sampling (part)", "Recent trends"]
topics = ["stereology", "delesse", "cavalieri", "crofton", "wicksell", "disector", "euler-characteristic", "membrane-thickness", "2d-to-3d"]
notes = """Read 2026-10-26. Delesse principle: under first-order stationarity, A(Y∩T)/A(T) is an unbiased estimator of VV "irrespective of the location of T" (Eqs. 17–19, p.158); Delesse (1847) showed "the mean area fraction of a mineral in a polished section of a rock is equal to the volume fraction". If neither structure nor probe is full-dimensional and Y is anisotropic, "the probe T should be isotropically rotated" (p.158). Cavalieri estimator V̂ = h·ΣA(z+kh) with z uniform random in [0,h) (Eq. 13, p.157); variance from the covariogram near the origin (Matheron; Gundersen & Jensen 1987) (p.168). Crofton/stereology: SV = (4/π)BA, SV = 2IL, LV = 2QA under isotropy (Eq. 24, p.162). Particles "cannot be counted unless a three dimensional probe is used" (p.159); the Wicksell problem "is indeterminate unless the particles are assumed to have specific, simple geometric shapes" and is ill-conditioned near the origin (p.160); NV = NA/E(H), but E(H) "is not accessible from independent sections" (p.160). Connectivity: χ = N(particles) − N(extra connections) + N(cavities); χ = ½(I − B + H) by disector sweep (Eqs. 22–23, p.160–161). Size distributions "are inaccessible from information solely on independent planar or linear sections unless the particles are assumed to have a simple geometric shape" (p.165–166). Membrane thickness: E(τ) = ½E(l), harmonic mean E(1/τ) = (3/2)E(1/l) for IUR lines; unfolding from planar-section strip widths solved by Cruz-Orive (1979) and Jensen et al. (1979); Var(τ) is estimable directly from planar but not linear sections (p.166). Point processes in 3D "require 3D probes" (p.167). Recent trend: random-set models (tessellations) often lack "a cross check of the models with stereological estimators, which are known to be unbiased and model free" (p.169)."""

