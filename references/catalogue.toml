notes = """Read in full 2026-10-15 (author-hosted copy). 3D Mn-oxide dendrites in zeolitised tuff grow from a fracture surface by attachment of Mn-oxide nanoparticles formed where Mn-bearing fluid mixes with oxygenated pore water: 'more in line with the diffusion-limited aggregation model' (chopard1991) than the viscous-fingering model (garciaruiz1994). Dendrites compete for particles: abundance falls and width rises with distance from the base, with lengths N(L) ~ L^-α, α ≈ 1.25. Finite particle concentration adds a diffusive length scale, so the forest is not fully scale-free (3D fractal dimension rising from ~2.70 to 2.80). Core–rim banding records discrete fluid pulses, with particles reaching dendrite tips first. A lattice-Boltzmann reaction–diffusion–aggregation model reproduces the morphology; higher concentrations give bulkier dendrites."""

