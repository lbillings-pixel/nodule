notes = """Read in full 2026-10-29 (owner's PDF; equations read from rendered pages; DOI as supplied, not Crossref-checked). Four authors, including Odgaard (p.217). χ3 = #parts − #extra connections + #enclosed cavities (Eq. 1); connectivity W = 2 − χ3 only for a single network without enclosed cavities (Eq. 2, p.217). χ is defined by sweeping a plane: islands and holes count +1 whether gained or lost, bridges −1, and the signed sum is independent of sweep direction (Fig. 1, p.218). Disector: χ3 = (I + H − B)/2 counted both ways (Eq. 3); χ_V = Σ(H + I − B)/(2·h·Σa) over uniformly sampled disectors (Eq. 4, p.218). W = 2 − χ_V·V(ref) (Eq. 5); fractionator W = 2 − f·χ' (Eq. 6, p.219). Worked bone example: H = 4, I = 1, B = 19 → χ = −14 in 1.56 mm³, χ_V = −8.99 mm⁻³, W ≈ 33,200 (Fig. 2, p.219). 'Flatlands syndrome': 3D connectivity cannot be estimated from 2D sections ('simply not room in a 2-D section'), and a 1D probe carries no 2D Euler information, though paired probes h apart do (pp.219–221, Fig. 3). Edge rule: two adjacent edges act as a profile, two as void; an isolated torus (χ = 0) does not count (Fig. 4, p.220, after Prasad et al. 1989). Needs perfect alignment of corresponding edges (hard for arbitrary imaging windows), near-perfect sections, and h small compared to the size and spacing of decisive features (p.221). Precision CE(W) = √(B+H+I)/(B−H−I) for systematic uniform disectors (Eq. 7, p.221); for isolated particles N := c·((H+I) − B) (Fig. 5 caption). DOI checked against Crossref 2026-10-30."""

