notes = """Read in full 2026-10-26 (pypdf text of the MSA scan). Oregon thunder eggs, quoting Dake: average about six inches across, from 1/4 inch to 3 feet, 'associated only with rhyolitic rocks', in lenses or 'beds' (p. 727). Ross: the most striking forms are five-pointed stars; 'the position cannot be determined in advance of cutting' (p. 727); some fillings are roughly square (Pl. 1d). Model (p. 729): in viscous or almost solid glass, 'expansion by rupture or tearing will require very much less energy' than spherical growth, and the rupture planes enclose the cavity symmetrically. Cube cavities come from six flattened four-sided pyramids (after Wright 1915, Iceland lithophysae). Stars are 'sections across a modified pyritohedron, each of whose 12, 5-sided faces is represented by an inward projecting pentagonal pyramid', produced by '30 triangular shear planes' (p. 729). The best star comes from a cut 'about one-third above or below the equator' (p. 731). Exterior: 'the boundaries between the twelve pseudopyritohedral faces are marked by irregular ridges on the outer surface' (p. 731), with small protuberances at each star point; the spherulite's outer boundary 'has a cauliflower-like habit although roughly spherical in shape' (p. 731). Host: devitrified welded tuff; the shell is radial feldspar + cristobalite. The surrounding glass altered to clay (probably bentonite), while 'The part that crystallized resisted weathering and lies imbedded in clay' (p. 731), which explains how the nodules are freed. Cavity growth: volatiles released by crystallisation plus cooling shrinkage of the enclosing material; chalcedony fill 'probably deposited during the alteration of the enclosing material to a clay' (p. 732). Formation claims are the author's interpretation (plausible); the geometry is observed."""

