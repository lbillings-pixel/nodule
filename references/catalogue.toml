notes = """Read in full 2026-10-29 (owner's scanned PDF, publisher OCR layer checked against page images; plates viewed). Theory (pp. 442-444): random quartz crystallites diffuse light by birefringent phase differences, transmission I = I0·exp(-π²(μ1-μ2)²Δz/λ²) after Raman's Christiansen theory (exponent decoded from the worked values), so thicker plates and coarser crystallites transmit less and redden; fibres with common a-axis pass light polarised along the fibres and diffuse the transverse component into a brush; laminae with c-axis orientation changing from lamina to lamina diffract, and act as a phase grating if periodic. Observations on five colourless plates 0.15–2 mm thick from the institute museum (no locality): transparency complementary between window light and oblique dark-field light, 'the dark portions now appear bright and vice versa' (p. 445, Figs. 4-5 for banded pieces); diffuse brush parallel to the banding that 'follows the course of banding' (p. 447); an enlargement 'exhibits numerous closely-spaced lamellae which are not visible' at smaller scale, 'a general feature' (p. 448); fine lamellae best seen 'on the boundary between light and darkness' (p. 448); diffraction spectra beside a small source; transmission falls rapidly with tilt of the band planes (p. 448). Lamellae attributed to c-axis orientation changing between successive layers across the fibres (p. 449). Qualitative only: no scales, spacings or angles. Does not describe a shadow effect, sectors or whole-stone viewing."""

