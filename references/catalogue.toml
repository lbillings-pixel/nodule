notes = """Analogue, read in full 2026-10-29 (owner's PDF, pypdf; Figs. 4-6 viewed). Uncertain annual layers 'are counted as 0.5 ± 0.5 years in the same manner as described by Rasmussen et al. (2006)' (pp. 3248-3249), so the rule originates there; assigned 'when only some of the used records display an annual signal, when the relative timing of seasonal peaks is inconsistent ... or ... the probability ... lies somewhere between 25% and 75%' (p. 3249). MCE = N × 0.5 yr, summed linearly (p. 3249); ½√N rejected as 'unrealistically low' because uncertain marks are correlated where resolution is limited; MCE used pragmatically as 2σ (pp. 3252-3253); final count takes every second uncertain layer (p. 3254). Effective resolution defined as 'the shortest wavelength that can be identified from the data': 10-25 mm for CFA recorded at 1 mm, about 4 mm for ECM (p. 3248). §3.3 (p. 3251, Fig. 4): single-record peak counts over 50 m are 'highly dependent on the measurement resolution'; fine VS overcounts sub-annual events, coarse Na misses thin stadial layers; 'None of the applied records alone suffices'. MCE assumes 'the data resolution is sufficient to resolve annual layers' (p. 3252). Checks: two counters differ by 1.3% < MCE; Laschamp within error; no direct bias test. No count-against-resolution curve."""

